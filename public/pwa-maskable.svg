<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for full bleed -->
    <radialGradient id="maskableDarkBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#181D26" />
      <stop offset="60%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#030407" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background for maskable crop -->
  <rect width="512" height="512" fill="url(#maskableDarkBg)" />

  <!-- Centered Scaled Logo inside safe zone (scaled to 82% inside 512x512) -->
  <g transform="translate(46, 46) scale(0.82)">
    <use href="/public/icon.svg#dropShadow" />
    <!-- Embedded SVG content -->
  </g>
</svg>
