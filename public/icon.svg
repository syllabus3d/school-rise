<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Royal to Vibrant Cobalt -->
    <linearGradient id="skBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#236BFD" />
      <stop offset="42%" stop-color="#185ADB" />
      <stop offset="78%" stop-color="#0E389C" />
      <stop offset="100%" stop-color="#071E56" />
    </linearGradient>

    <!-- Outer Rim Stroke Gradient -->
    <linearGradient id="skRimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80ADFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#3D7EFA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF9E59" stop-opacity="0.6" />
    </linearGradient>

    <!-- Warm Tangerine to Coral Gold Gradient -->
    <linearGradient id="skTangerineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA86B" />
      <stop offset="45%" stop-color="#FF8A3D" />
      <stop offset="100%" stop-color="#E65812" />
    </linearGradient>

    <!-- Brilliant Gold Accent -->
    <linearGradient id="skGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CC" />
      <stop offset="50%" stop-color="#FFC043" />
      <stop offset="100%" stop-color="#E68A00" />
    </linearGradient>

    <!-- Crisp White Page Gradient -->
    <linearGradient id="skPageGradLeft" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F2F6FF" />
      <stop offset="100%" stop-color="#D9E4FF" />
    </linearGradient>

    <linearGradient id="skPageGradRight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F2F6FF" />
      <stop offset="100%" stop-color="#D9E4FF" />
    </linearGradient>

    <!-- Drop Shadows for 3D Icon Lift -->
    <filter id="skIconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#02091C" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#02091C" flood-opacity="0.3" />
    </filter>

    <filter id="skSparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container with Soft Shadow -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="108" 
    fill="url(#skBgGradient)" 
    filter="url(#skIconShadow)"
  />

  <!-- Subtle Inner Border / Rim Stroke -->
  <rect 
    x="34" 
    y="34" 
    width="444" 
    height="444" 
    rx="106" 
    fill="none" 
    stroke="url(#skRimGradient)" 
    stroke-width="4.5" 
  />

  <!-- Top Glass Highlight Arc -->
  <path 
    d="M 64,120 C 64,72 104,40 152,40 L 360,40 C 408,40 448,72 448,120 C 370,140 290,148 210,140 C 145,134 98,126 64,120 Z" 
    fill="#FFFFFF" 
    opacity="0.08" 
  />

  <!-- Ambient Glow Behind Center Emblem -->
  <circle cx="256" cy="260" r="140" fill="#FF8A3D" opacity="0.12" filter="url(#skSparkGlow)" />
  <circle cx="256" cy="240" r="90" fill="#236BFD" opacity="0.25" filter="url(#skSparkGlow)" />

  <!-- ==================== MAIN EMBLEM GROUP ==================== -->
  <g id="mainLogoEmblem">

    <!-- 1. OPEN BOOK WINGS (Base of Vocabulary) -->
    <!-- Left Book Page Wing -->
    <path 
      d="M 246,386 C 196,368 138,368 86,384 C 77,387 68,380 68,370 L 68,266 C 68,258 74,252 82,250 C 136,236 196,238 246,258 Z" 
      fill="url(#skPageGradLeft)" 
    />
    <!-- Left Page Inner Shadow / Layering Line -->
    <path 
      d="M 238,372 C 194,356 142,356 94,370 L 94,270 C 142,258 194,258 238,272 Z" 
      fill="#FFFFFF" 
      opacity="0.85" 
    />

    <!-- Right Book Page Wing -->
    <path 
      d="M 266,386 C 316,368 374,368 426,384 C 435,387 444,380 444,370 L 444,266 C 444,258 438,252 430,250 C 376,236 316,238 266,258 Z" 
      fill="url(#skPageGradRight)" 
    />
    <!-- Right Page Inner Shadow / Layering Line -->
    <path 
      d="M 274,372 C 318,356 370,356 418,370 L 418,270 C 370,258 318,258 274,272 Z" 
      fill="#FFFFFF" 
      opacity="0.85" 
    />

    <!-- Central Bookmark Ribbon (Tangerine Flame/Ribbon) -->
    <path 
      d="M 244,248 L 268,248 L 268,416 L 256,402 L 244,416 Z" 
      fill="url(#skTangerineGrad)" 
    />

    <!-- 2. DEVANAGARI 'श' + ENGLISH 'A' BILINGUAL CREST -->

    <!-- Shirorekha (Top Horizontal Bar) -->
    <rect 
      x="136" 
      y="114" 
      width="240" 
      height="26" 
      rx="13" 
      fill="#FFFFFF" 
    />

    <!-- 'श' Main Loop & Dynamic Curve (Devanagari Sha) -->
    <path 
      d="M 218,136 
         C 168,136 128,172 128,218 
         C 128,258 158,286 196,286 
         C 224,286 246,272 258,252 
         L 294,324 
         C 300,336 316,340 328,332 
         C 340,324 344,308 334,294 
         L 292,216 
         C 298,206 302,194 302,180 
         C 302,148 268,136 218,136 Z
         M 214,166 
         C 240,166 264,172 264,192 
         C 264,212 246,236 212,236 
         C 186,236 166,220 166,198 
         C 166,178 186,166 214,166 Z" 
      fill="#FFFFFF" 
    />

    <!-- Vertical Stem of 'श' / English 'A' Pillar (Right Side) -->
    <rect 
      x="334" 
      y="136" 
      width="26" 
      height="228" 
      rx="13" 
      fill="#FFFFFF" 
    />

    <!-- Crossbar connecting 'श' loop to 'A' stem -->
    <path 
      d="M 252,236 L 338,236 C 344,236 348,241 348,247 C 348,253 344,258 338,258 L 252,258 C 246,258 242,253 242,247 C 242,241 246,236 252,236 Z" 
      fill="#FFFFFF" 
    />

    <!-- 3. VIBRANT TANGERINE KNOWLEDGE SPARK (Inside 'श' Loop) -->
    <!-- The Brilliant 4-Point Diamond Spark / Enlightenment -->
    <g transform="translate(214, 198)">
      <!-- Outer Soft Glow -->
      <circle cx="0" cy="0" r="28" fill="#FF8A3D" opacity="0.4" filter="url(#skSparkGlow)" />
      
      <!-- Primary 4-Point Geometric Star -->
      <path 
        d="M 0,-34 Q 0,0 34,0 Q 0,0 0,34 Q 0,0 -34,0 Q 0,0 0,-34 Z" 
        fill="url(#skTangerineGrad)" 
      />

      <!-- Inner Brilliant Gold Core -->
      <path 
        d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" 
        fill="url(#skGoldGrad)" 
      />

      <!-- Center White Spark Center -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- Top Right Sparkle / Magic Flash Accent -->
    <g transform="translate(394, 96)">
      <circle cx="0" cy="0" r="14" fill="#FFA86B" opacity="0.35" filter="url(#skSparkGlow)" />
      <path 
        d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" 
        fill="url(#skGoldGrad)" 
      />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>

    <!-- Little Spark Accent Near Left Shirorekha -->
    <g transform="translate(122, 110)">
      <circle cx="0" cy="0" r="8" fill="#FFA86B" opacity="0.3" />
      <path 
        d="M 0,-9 Q 0,0 9,0 Q 0,0 0,9 Q 0,0 -9,0 Q 0,0 0,-9 Z" 
        fill="#FFD27A" 
      />
    </g>

  </g>
</svg>
